display_name: Schadensmeldungs-Assistent
description: Deutschsprachiger Schadensservice-Agent fuer Versicherungsfaelle. Er
  nimmt eine Schadensmeldung am Telefon strukturiert auf, fragt genau die benoetigten
  sechs Felder ab und liest die Angaben am Ende deutlich zur Bestaetigung vor.
